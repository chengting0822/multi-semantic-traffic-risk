[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-semantic-traffic-risk"
version = "0.1.0"
description = "Video-based multi-semantic traffic-risk assessment and active warning framework"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Cheng-Ting Tsai"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "torch>=2.5",
]

[project.optional-dependencies]
detection = [
  "opencv-python>=4.10",
  "tqdm>=4.66",
  "ultralytics>=8.3",
]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
traffic-risk = "traffic_risk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
